[project]
name = "model-serving"
version = "0.1.0"
description = "Standalone multi-node vLLM deployment control plane and OpenAI gateway"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.110,<1",
    "httpx>=0.27,<1",
    "huggingface-hub>=0.27,<2",
    "pydantic>=2,<3",
    "uvicorn>=0.29,<1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
